name: Alpha feedback
description: Share general feedback after testing DECY
title: "Feedback: "
labels: ["feedback", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Share what felt useful, confusing, missing, or unnecessary. Please avoid private details. Short, concrete feedback is very useful.

  - type: textarea
    id: context
    attributes:
      label: What were you trying to do?
      placeholder: I was trying to decide whether to...
    validations:
      required: true

  - type: textarea
    id: useful
    attributes:
      label: What felt useful?
      placeholder: The app helped me because...
    validations:
      required: false

  - type: textarea
    id: confusing
    attributes:
      label: What felt confusing, too heavy, or unclear?
      placeholder: I did not understand...
    validations:
      required: false

  - type: textarea
    id: missing
    attributes:
      label: What was missing?
      placeholder: I expected to be able to...
    validations:
      required: false

  - type: dropdown
    id: value
    attributes:
      label: Would you use this again?
      options:
        - Yes, clearly
        - Maybe, if improved
        - Not sure
        - Probably not
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: App language used
      placeholder: French / English / Spanish / other
    validations:
      required: false

  - type: textarea
    id: final-note
    attributes:
      label: Anything else?
      description: Optional. Please avoid personal or sensitive details.
    validations:
      required: false