name: Language or translation issue
description: Report a translation, wording, or language issue
title: "[Language] "
labels: [translation, needs-review]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - French
        - English
        - Spanish
        - Other
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Where did you see it?
      placeholder: Home, settings, contract detail...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
      placeholder: Copy the wording if possible.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
      placeholder: Suggest a clearer translation or phrase.
    validations:
      required: false
  - type: dropdown
    id: issue-type
    attributes:
      label: Type of issue
      options:
        - Translation is wrong
        - Wording is unclear
        - Tone feels strange
        - Text is still in another language
        - Other
    validations:
      required: true
