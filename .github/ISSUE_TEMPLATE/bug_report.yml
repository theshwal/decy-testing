name: Bug report
description: Report something that does not work as expected
title: "[Bug] "
labels: [bug, needs-review]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please avoid sharing private information or sensitive documents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug in a few sentences.
      placeholder: I tapped..., then...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps if you can.
      placeholder: |
        1. Open...
        2. Tap...
        3. See...
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - Blocking — I cannot continue
        - High — important feature unusable
        - Medium — confusing or inconvenient
        - Low — small issue
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Android 14 / iPhone 15 / emulator...
    validations:
      required: false
  - type: input
    id: language
    attributes:
      label: App language
      placeholder: French / English / Spanish...
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or screen recording
      description: Optional. Blur or remove personal information first.
    validations:
      required: false
