name: Bug report
description: Report something that does not work in the DECY alpha
title: "Bug: "
labels: ["bug", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include private personal information, access keys, contracts, invoices, addresses, phone numbers, or screenshots containing secrets.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue clearly.
      placeholder: I tried to... but the app...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected the app to...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that led to the issue, if you can.
      placeholder: |
        1. Open...
        2. Tap...
        3. Choose...
        4. See...
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How severe is it?
      options:
        - Blocking — I cannot continue
        - Important — I can continue but it is confusing or broken
        - Minor — small issue or visual problem
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Android 14 / iPhone 15 / tablet / emulator...
    validations:
      required: false

  - type: input
    id: app-language
    attributes:
      label: App language
      placeholder: French / English / Spanish / other
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or notes
      description: Optional. Remove or hide private information before posting.
    validations:
      required: false