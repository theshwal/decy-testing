name: Feature idea
description: Suggest an improvement or future feature
title: "Idea: "
labels: ["idea", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome, but DECY is still in alpha. The most useful ideas are tied to a concrete decision or real-life situation.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I often need to...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      placeholder: DECY could...
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Very important
        - Useful but not essential
        - Nice to have
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: What do you do today instead?
      placeholder: Today I use...
    validations:
      required: false

  - type: input
    id: language
    attributes:
      label: Preferred language
      placeholder: French / English / Spanish / other
    validations:
      required: false